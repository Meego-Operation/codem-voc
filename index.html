<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>飞书 CodeM 反馈汇总 · PPT</title>
<style>
  :root{
    --bg0:#f0f7ff;
    --bg1:#e3eefb;
    --panel:#ffffff;
    --panel2:#e8f2fc;
    --line:#cddef2;
    --txt:#1d2c4c;
    --mut:#5b6c88;
    --cy:#1a8bff;
    --ma:#5b7bff;
    --gr:#22a06b;
    --rd:#dd4b4b;
    --am:#d07a1e;
    --bl:#4a74e0;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;
    background:
      radial-gradient(1200px 700px at 80% -10%, rgba(80,150,255,.16), transparent 60%),
      radial-gradient(900px 600px at 0% 110%, rgba(110,140,255,.14), transparent 60%),
      linear-gradient(160deg,var(--bg0),var(--bg1));
    color:var(--txt);
    overflow:hidden;
    position:relative;
  }
  #progress{position:fixed;top:0;left:0;height:3px;background:linear-gradient(90deg,var(--cy),var(--ma),var(--gr));transition:width .5s ease;z-index:50;}
  #stage{width:100vw;height:100vh;position:relative;}
  .slide{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;
    padding:5vh 6vw;opacity:0;visibility:hidden;transition:opacity .55s ease,transform .55s ease;}
  .slide.active{opacity:1;visibility:visible;}
  #stage.sr .slide.active{animation:slideR .55s ease;}
  #stage.sl .slide.active{animation:slideL .55s ease;}
  @keyframes slideR{from{opacity:0;transform:translateX(70px) scale(.99)}to{opacity:1;transform:none}}
  @keyframes slideL{from{opacity:0;transform:translateX(-70px) scale(.99)}to{opacity:1;transform:none}}
  .inner{width:min(1180px,92vw);max-height:88vh;overflow:hidden;display:flex;flex-direction:column;}

  /* header */
  .htop{display:flex;align-items:baseline;gap:14px;margin-bottom:6px;flex-wrap:wrap;}
  .kicker{font-size:12px;letter-spacing:3px;color:var(--cy);text-transform:uppercase;font-weight:700;}
  .mtitle{font-size:clamp(26px,3.4vw,40px);font-weight:800;letter-spacing:.5px;
    background:linear-gradient(90deg,#1b3a78,var(--cy));-webkit-background-clip:text;background-clip:text;color:transparent;}
  .hsub{color:var(--mut);font-size:14px;margin-bottom:20px;}
  .tag{display:inline-flex;align-items:center;gap:6px;background:var(--panel2);border:1px solid var(--line);
    padding:3px 10px;border-radius:999px;font-size:12px;color:var(--mut);margin-left:auto;}

  .grid{display:grid;gap:14px;flex:1;min-height:0;}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:16px 18px;backdrop-filter:blur(4px);}
  .card h3{font-size:14px;color:var(--mut);font-weight:600;margin-bottom:12px;display:flex;align-items:center;gap:8px;}
  .card h3 .dot{width:8px;height:8px;border-radius:50%;display:inline-block;}

  /* page1 */
  .ov-grid{grid-template-columns:1fr 1.6fr;grid-template-rows:auto 1fr;gap:14px;padding-top:6px;}
  .kpis{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;}
  .kpi{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:14px 16px;text-align:center;}
  .kpi .nv{font-size:clamp(26px,3vw,36px);font-weight:800;}
  .kpi .lb{font-size:12px;color:var(--mut);margin-top:2px;}
  .kpi.b .nv{color:var(--cy)} .kpi.g .nv{color:var(--gr)} .kpi.r .nv{color:var(--rd)}
  .bars{margin-top:6px;display:flex;flex-direction:column;gap:12px;}
  .bar{display:flex;align-items:center;gap:10px;}
  .bar .nm{width:86px;font-size:13px;color:var(--mut);text-align:right;flex:none;}
  .bar .tr{flex:1;height:9px;background:rgba(150,180,215,.28);border-radius:6px;overflow:hidden;}
  .bar .fl{height:100%;border-radius:6px;width:0;transition:width .8s cubic-bezier(.2,.8,.2,1);}
  .bar .vl{width:30px;font-size:12px;color:var(--txt);font-weight:700;flex:none;}

  /* source list */
  .src{display:flex;flex-wrap:wrap;gap:8px;}
  .src .chip{background:var(--panel2);border:1px solid var(--line);border-radius:8px;padding:6px 10px;font-size:12px;}
  .src .chip b{color:var(--cy);margin-left:4px;}

  /* board pages */
  .b-list{display:flex;flex-direction:column;gap:12px;overflow:auto;padding-right:4px;}
  .bp{display:flex;gap:14px;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:12px 14px;align-items:flex-start;transition:border-color .3s,background .3s;}
  .bp:hover{border-color:var(--cy);background:var(--panel2);}
  .rk{flex:none;width:34px;height:34px;border-radius:9px;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:15px;
    background:linear-gradient(135deg,var(--cy),var(--bl));color:#06121f;}
  .rk.alt{background:linear-gradient(135deg,var(--ma),var(--cy));color:#1a0527;}
  .bk-m{flex:1;min-width:0;}
  .bk-top{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:5px;}
  .q{font-size:16px;font-weight:700;line-height:1.4;}
  .co{font-size:11px;color:#1564c4;background:rgba(26,139,255,.10);border:1px solid rgba(26,139,255,.35);padding:2px 8px;border-radius:999px;margin-left:auto;white-space:nowrap;}
  .ans{font-size:13px;color:var(--mut);line-height:1.55;margin-top:4px;padding-left:12px;border-left:2px solid var(--line);}
  .csrc{font-size:11px;color:var(--mut);margin-top:3px;}
  .img-toggle{display:inline-flex;align-items:center;gap:6px;font-size:12px;color:#1564c4;background:rgba(26,139,255,.10);border:1px solid rgba(26,139,255,.38);border-radius:999px;padding:3px 11px;cursor:pointer;margin-top:6px;user-select:none;width:max-content;}
  .img-toggle::before{content:"▼";font-size:10px;transition:transform .3s}
  .img-toggle.on::before{transform:rotate(180deg)}
  .img-toggle:hover{background:rgba(26,139,255,.18)}
  .shot-wrap{max-height:0;overflow:hidden;transition:max-height .45s ease;}
  .shot-wrap.open{max-height:460px}
  .shot-wrap .shot{display:block;max-width:100%;max-height:360px;margin-top:8px;border:1px solid var(--line);border-radius:8px;}
  .pills{display:flex;flex-direction:row;flex-wrap:wrap;justify-content:flex-end;align-items:center;gap:3px 6px;margin-left:auto;}
  .pills .p{font-size:11px;color:#1564c4;background:rgba(26,139,255,.10);border:1px solid rgba(26,139,255,.35);padding:2px 8px;border-radius:999px;white-space:nowrap;}
  .doc-link{display:inline-flex;align-items:center;gap:6px;font-size:13px;color:#1a6bff;margin-top:6px;text-decoration:none;border:1px dashed rgba(26,139,255,.45);background:rgba(26,139,255,.08);padding:6px 10px;border-radius:8px;}
  .doc-link:hover{background:rgba(26,139,255,.16);text-decoration:underline}
  .empty{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;padding:40px 20px;text-align:center;color:var(--mut);border:1px dashed var(--line);border-radius:14px;background:var(--panel);}
  .empty .ic{font-size:34px;opacity:.5}

  .two-pb{grid-template-columns:1fr 1fr;gap:16px;padding-top:4px;}
  .two-pb .col{display:flex;flex-direction:column;gap:12px;min-height:0;}
  .col h2{font-size:15px;font-weight:700;display:flex;align-items:center;gap:8px;margin-bottom:4px;}

  /* nav */
  .nav{position:fixed;top:0;bottom:0;width:7vw;min-width:54px;display:flex;align-items:center;justify-content:center;cursor:pointer;z-index:30;background:transparent;border:0;color:var(--mut);font-size:30px;transition:color .25s,background .25s;}
  .nav:hover{color:#1564c4;background:linear-gradient(90deg,rgba(26,139,255,.12),transparent);}
  .nav.r{right:0;}
  .nav.l{left:0;background:linear-gradient(270deg,rgba(26,139,255,.12),transparent);}
  #pager{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);color:var(--mut);font-size:13px;letter-spacing:1px;z-index:30;
    background:var(--panel2);border:1px solid var(--line);padding:4px 14px;border-radius:999px;backdrop-filter:blur(4px);}
  #pager b{color:var(--txt)}
  #dots{position:fixed;bottom:20px;right:22px;display:flex;gap:8px;z-index:30;}
  #dots i{width:8px;height:8px;border-radius:50%;background:rgba(140,165,198,.6);cursor:pointer;transition:.3s;}
  #dots i.on{width:22px;border-radius:4px;background:linear-gradient(90deg,var(--cy),var(--ma));}
  ::-webkit-scrollbar{width:6px}::-webkit-scrollbar-thumb{background:rgba(140,165,198,.55);border-radius:3px}
  .foot-note{color:var(--mut);font-size:11px;margin-top:12px;text-align:center}
  /* 周期筛选器 */
  .pfixed{display:inline-flex;align-items:center;gap:5px;background:var(--panel2);border:1px solid var(--line);border-radius:999px;padding:4px 6px;backdrop-filter:blur(6px);box-shadow:0 2px 10px rgba(30,80,160,.10);margin-left:auto;flex:none;}
  .pfixed .plabel{font-size:11px;color:var(--mut);padding:0 4px;letter-spacing:1px;}
  .pfixed button{border:1px solid transparent;background:transparent;color:var(--mut);font-size:12px;padding:4px 12px;border-radius:999px;cursor:pointer;transition:.25s;font-family:inherit;}
  .pfixed button:hover{color:var(--cy);}
  .pfixed button.on{background:linear-gradient(90deg,var(--cy),var(--ma));color:#fff;font-weight:700;box-shadow:0 2px 8px rgba(26,139,255,.35);}
  .pfixed .pnew{font-size:9px;background:#ff6b35;color:#fff;border-radius:4px;padding:1px 4px;margin-left:5px;vertical-align:1px;}
  .pfixed.pmini{padding:3px 5px;gap:4px;box-shadow:none;margin-left:0;}
  .pfixed.pmini button{font-size:11px;padding:3px 10px;}
  .ttrow{display:flex;align-items:center;gap:12px;flex-wrap:wrap;}
  @media(max-width:820px){
    .ov-grid{grid-template-columns:1fr} .two-pb{grid-template-columns:1fr}
    .nav{width:48px;min-width:40px} .slide{padding:2vh 4vw 10vh;justify-content:flex-start;overflow-y:auto;-webkit-overflow-scrolling:touch}
    .co{margin-left:0}
    #kpis{flex-wrap:wrap;gap:8px}
    #kpis .kpi{flex:1 1 30%;padding:10px 8px}
    .pfixed .plabel{display:none}
    .pfixed button{padding:4px 8px;font-size:11px}
    .inner{width:94vw;max-height:none;overflow:visible;margin:auto 0}
    .bar .vl{font-size:13px}
    .shot-wrap.open{max-height:840px}
    body{-webkit-overflow-scrolling:touch}
  }
  @media(max-width:480px){
    #kpis .kpi{flex:1 1 45%}
    .pfixed.pmini button{font-size:10px;padding:2px 6px}
    .kpi .nv{font-size:20px}
    .kpi .lb{font-size:10px}
  }
  #stage{touch-action:pan-y;}
</style>
</head>
<body>
<div id="progress"></div>

<div id="stage">
  <!-- PAGE 1 总览 -->
  <section class="slide active" data-i="0">
    <div class="inner">
      <div class="htop">
        <div>
          <div class="kicker">CodeM · VOC Feedback</div>
          <h1 class="mtitle">飞书 CodeM 反馈汇总</h1>
          <div class="hsub">反馈来源：飞书群反馈 · 文档《飞书CodeM VOC 反馈汇总》</div>
        </div>
        <div class="pfixed" id="pfixed"><span class="plabel">⏱ 时间周期</span></div>
      </div>
      <div class="kpis" id="kpis"></div>
      <div class="grid ov-grid">
        <div class="card">
          <h3><span class="dot" style="background:var(--cy)"></span>五类反馈分布（条）</h3>
          <div class="bars" id="catBars"></div>
        </div>
        <div class="card">
          <h3><span class="dot" style="background:var(--gr)"></span>反馈来源 · 高频出现方</h3>
          <div class="src" id="srcChips"></div>
          <div class="foot-note">统计来自各条反馈原声中出现的公司 / 渠道标记</div>
        </div>
      </div>
    </div>
  </section>

  <!-- PAGE 2 常见咨询 -->
  <section class="slide" data-i="1">
    <div class="inner">
      <div class="htop"><div>
        <div class="kicker">TOP 高频问题</div>
        <div class="ttrow"><h1 class="mtitle">常见咨询</h1><span class="pfixed pmini" data-pf></span></div>
        <div class="hsub">咨询最多、反复被问到的产品 / 使用问题</div>
      </div><span class="tag" id="consultTag"></span></div>
      <div class="b-list" id="consultList"></div>
    </div>
  </section>

  <!-- PAGE 3 bug 统计 -->
  <section class="slide" data-i="2">
    <div class="inner">
      <div class="htop"><div>
        <div class="kicker">在使用中遇到</div>
        <div class="ttrow"><h1 class="mtitle">Bug 统计</h1><span class="pfixed pmini" data-pf></span></div>
        <div class="hsub">用户反映的产品缺陷 / 异常</div>
      </div><span class="tag" id="bugTag"></span></div>
      <div class="b-list" id="bugList"></div>
    </div>
  </section>

  <!-- PAGE 4 需求建议 -->
  <section class="slide" data-i="3">
    <div class="inner">
      <div class="htop"><div>
        <div class="kicker">希望 CodeM 更好</div>
        <div class="ttrow"><h1 class="mtitle">需求建议</h1><span class="pfixed pmini" data-pf></span></div>
        <div class="hsub">对产品功能、界面、交互的改进诉求</div>
      </div><span class="tag" id="reqTag"></span></div>
      <div class="b-list" id="reqList"></div>
    </div>
  </section>

  <!-- PAGE 5 正向 & 负向 -->
  <section class="slide" data-i="4">
    <div class="inner">
      <div class="htop"><div>
        <div class="kicker">声音两极</div>
        <div class="ttrow"><h1 class="mtitle">正向反馈 &nbsp;/&nbsp; 负向反馈</h1><span class="pfixed pmini" data-pf></span></div>
        <div class="hsub">用户正面认可与负面意见</div>
      </div></div>
      <div class="grid two-pb">
        <div class="col">
          <h2><span class="dot" style="background:var(--gr)"></span>正向反馈</h2>
          <div class="b-list" id="posList"></div>
        </div>
        <div class="col">
          <h2><span class="dot" style="background:var(--rd)"></span>负向反馈</h2>
          <div class="empty">
            <div class="ic">📭</div>
            <div id="negEmptyTxt"></div>
          </div>
        </div>
      </div>
    </div>
  </section>
</div>

<button class="nav l" id="prev" aria-label="上一页">‹</button>
<div id="dots"></div>
<button class="nav r" id="next" aria-label="下一页">›</button>
<div id="pager"><b id="curP">1</b> / <span id="totP">5</span></div>

function renderOverview(){

  var TOTAL=d.total,POS=d.pos.length,NEG=d.neg.length;
  $("#kpis").innerHTML=
    `<div class="kpi b"><div class="nv" data-v="${TOTAL}">0</div><div class="lb">用户声音累计（条）</div></div>

  countUp();
  var SLIDE_OF={"常见咨询":1,"Bug 统计":2,"需求建议":3,"正向反馈":4,"负向反馈":4};
  var max=Math.max.apply(null,CATS.map(x=>x.n))||1;
  $("#catBars").innerHTML=CATS.map((c,i)=>{
    var pct=Math.round(c.n/max*100);
    var gcol=["","linear-gradient(90deg,var(--cy),var(--bl))","linear-gradient(90deg,var(--rd),var(--am))","linear-gradient(90deg,var(--am),var(--cy))","linear-gradient(90deg,var(--gr),var(--cy))","rgba(255,255,255,.22)"][i+1];
    return `<div class="bar" style="cursor:pointer" onclick="goTo(${SLIDE_OF[c.k]})" title="点击查看「${c.k}」细目"><span class="nm">${c.k}</span>
      <div class="tr"><div class="fl" data-w="${pct}" style="background:${gcol}"></div></div>
      <span class="vl">${c.n}</span></div>`;
  }).join("");
  setTimeout(function(){$$("#catBars .fl").forEach(function(f){f.style.width=f.getAttribute("data-w")+"%";});},80);
  /* 来源高频 */
  var freq={};
  [].concat(d.consult,d.bug,d.req,d.pos).forEach(function(it){
    (it.src||"").split(/[·、(]\s*/).forEach(function(s){
      s=s.replace(/[）\)]$/,"").replace(/\s*（?\d+）?$/,"").trim();
      if(!s)return; s=s.replace(/（.*$/,"").trim(); if(!s)return;
      freq[s]=(freq[s]||0)+1;
    });
  });
  var chips=Object.keys(freq).map(function(k){return {k:k,n:freq[k]};})
    .sort(function(a,b){return b.n-a.n;}).slice(0,12);
  $("#srcChips").innerHTML=chips.map(function(c){return `<span class="chip">${esc(c.k)}<b>×${c.n}</b></span>`;}).join("");
}
function countUp(){
  $$(".kpi .nv").forEach(function(el){
    var target=+el.getAttribute("data-v"),t0=null,dur=900;
    function step(ts){if(!t0)t0=ts;var p=Math.min((ts-t0)/dur,1);
      el.textContent=Math.round(target*(1-Math.cos(p*Math.PI))/2);
      if(p<1)requestAnimationFrame(step);}
    requestAnimationFrame(step);
  });
}

      var img=im1
    ?`<div class="img-toggle" onclick="this.classList.toggle('on');var w=this.closest('.bk-m').querySelector('.shot-wrap');if(w)w.classList.toggle('open');" title="点击展开/收起截图">📷 查看截图</div>
      <div class="shot-wrap"><img class="shot" src="${im1}" alt="${esc(it.q)}" loading="lazy">${it.img2?`<img class="shot" src="${imres(it.img2)}" alt="${esc(it.q)}" loading="lazy">`:""}</div>`
        :"";
      return `<div class="bp">
    <div class="${rk}">${rkNum}</div>
      <div class="bk-m">
        <div class="bk-top"><span class="q">${esc(it.q)}</span>${pills}</div>
        ${ans}${doc}${img}
      </div></div>`;
  }).join("");
  }

function renderBoards(){
var d=P();
renderList("#consultList",d.consult,"consult");
renderList("#bugList",d.bug,"bug");
  renderList("#reqList",d.req,"req");
  renderList("#posList",d.pos,"pos","本周期文档未收录「正向反馈」板块，暂无数据。");
  $("#consultTag").textContent="文档共 "+d.tconsult+" 条 · 明细 "+d.consult.length+" 条";
  $("#bugTag").textContent="文档共 "+d.tbug+" 条 · 明细 "+d.bug.length+" 条";
  $("#reqTag").textContent="文档共 "+d.treq+" 条 · 明细 "+d.req.length+" 条";
  $("#negEmptyTxt").innerHTML="文档《飞书CodeM VOC 反馈汇总》本周期（"+curPeriod+"）<br>未收录「负向反馈」板块，暂无数据。";
}

/* ------- 周期筛选 ------- */
function buildSwitcher(){
  $$(".pfixed").forEach(function(h){
  PERIOD_ORDER.forEach(function(pk){
    var b=document.createElement("button");
    b.setAttribute("data-p",pk);
    b.innerHTML=esc(pk)+(PERIODS[pk].isLatest?'<span class="pnew">最新</span>':"");
    b.onclick=function(){setPeriod(pk);};
    h.appendChild(b);
  });
});
}
  function setPeriod(pk){
  if(pk===curPeriod)return;
  curPeriod=pk;
  $$(".pfixed button").forEach(function(b){b.classList.toggle("on",b.getAttribute("data-p")===pk);});
renderAll();
}
function renderAll(){renderOverview();renderBoards();}

/* ------- 翻页 ------- */
var slides=$$(".slide"),cur=0,TOTALP=slides.length;
var stage=$("#stage"),dotsH=$("#dots");
dotsH.innerHTML=slides.map(function(_,i){return `<i data-i="${i}"></i>`;}).join("");
$$("#dots i").forEach(function(d){d.onclick=function(){goTo(+d.getAttribute("data-i"));};});
$("#prev").onclick=function(){goTo(cur-1);};
$("#next").onclick=function(){goTo(cur+1);};
document.addEventListener("keydown",function(e){
  if(e.key==="ArrowRight"||e.key==="ArrowDown"||e.key===" "){e.preventDefault();goTo(cur+1);}
  if(e.key==="ArrowLeft"||e.key==="ArrowUp"){e.preventDefault();goTo(cur-1);}
});
var wheelLock=false;
window.addEventListener("wheel",function(e){
  if(wheelLock)return;wheelLock=true;setTimeout(function(){wheelLock=false;},650);
  if(Math.abs(e.deltaY)>32)goTo(cur + (e.deltaY>0?1:-1));
},{passive:true});
/* 触摸滑动翻页：左滑下一页 / 右滑上一页 */
var tx=0,ty=0,tT=0,touchLock=false,lastTouch=0;
document.addEventListener("touchstart",function(e){
  lastTouch=Date.now();
  if(e.touches.length!==1)return;
tx=e.touches[0].clientX;ty=e.touches[0].clientY;tT=Date.now();
},{passive:true});
document.addEventListener("touchend",function(e){
  if(touchLock||!tT)return;
  var t=e.changedTouches[0],dx=t.clientX-tx,dy=t.clientY-ty,dt=Date.now()-tT;
  tT=0;
  if(dt>800)return;
  if(Math.abs(dx)>48&&Math.abs(dx)>Math.abs(dy)*1.5){
    touchLock=true;setTimeout(function(){touchLock=false;},650);
    goTo(cur+(dx<0?1:-1));
  }
},{passive:true});
/* 鼠标拖拽翻页（PC 端）：按住左滑下一页 / 右滑上一页 */
var mDown=false,mx=0,my=0,mMoved=0;
document.addEventListener("mousedown",function(e){
  if(e.button!==0)return;
  if(Date.now()-lastTouch<800)return; /* 忽略移动端 tap 合成的鼠标事件 */
mDown=true;mx=e.clientX;my=e.clientY;mMoved=0;
});
document.addEventListener("mousemove",function(e){
  if(!mDown)return;
  mMoved=Math.max(mMoved,Math.abs(e.clientX-mx));
  if(mMoved>10)document.body.style.userSelect="none";
});
document.addEventListener("mouseup",function(e){
  if(!mDown)return;mDown=false;
  document.body.style.userSelect="";
  var dx=e.clientX-mx,dy=e.clientY-my;
  if(mMoved>10){/* 拖拽后抑制紧随的 click，避免误触展开/跳转 */
    var sup=function(ev){ev.stopPropagation();ev.preventDefault();};
    document.addEventListener("click",sup,true);
    setTimeout(function(){document.removeEventListener("click",sup,true);},50);
  }
  if(Math.abs(dx)>48&&Math.abs(dx)>Math.abs(dy)*1.5){
    goTo(cur+(dx<0?1:-1));
  }
});

function goTo(i){
  if(i<0||i>=TOTALP||i===cur)return;
  var dir=i>cur?1:-1;
  stage.classList.remove("sl","sr");
  void stage.offsetWidth;
  stage.classList.add(dir>0?"sr":"sl");
  slides[cur].classList.remove("active");
  cur=i;
  slides[cur].classList.add("active");
  $("#curP").textContent=cur+1;
  $("#progress").style.width=((cur+1)/TOTALP*100)+"%";
  $$("#dots i").forEach(function(d,k){d.classList.toggle("on",k===cur);});
}

buildSwitcher();
$$(".pfixed button").forEach(function(b){b.classList.toggle("on",b.getAttribute("data-p")===curPeriod);});
renderAll();
goTo(0);
</script>
</body>
